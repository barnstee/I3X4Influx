name: Tests

# Builds the solution and runs the unit/integration tests on every push to main
# and on every pull request targeting it.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    # The tests use Testcontainers to build the adapter's Docker image from the
    # repository Dockerfile and run it, so the runner must provide a Docker daemon.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore I3X4Influx.sln

      - name: Build
        run: dotnet build I3X4Influx.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test I3X4Influx.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
